​<!DOCTYPE html>
<html>
<head>
<title>Movie Recap</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<h2>ဗီဒီယို တင်ရန်</h2>
<input type="file" id="v" accept="video/*">



<video id="p" controls playsinline style="width:100%; max-height:400px; display:none; background:#000;"></video>


<button onclick="m()" style="padding:10px; margin-top:10px;">အသံပိတ်ရန် (Mute)</button>



<h3>အသံဖိုင် (Voiceover) တင်ရန်</h3>
<input type="file" id="a" accept="audio/*">



<audio id="ap" controls style="display:none; width:100%;"></audio>
​<script>
let u = document.getElementById('v');
let d = document.getElementById('p');
​u.onchange = function(e) {
let file = e.target.files[0];
if (file) {
d.src = URL.createObjectURL(file);
d.style.display = 'block';
d.load();
}
}
​// ဗီဒီယို ဘာကြောင့်မပွင့်တာလဲဆိုတာ ဘရောက်ဇာကို တိုက်ရိုက်မေးပြီး ဖမ်းပြခိုင်းခြင်း
d.onerror = function() {
let err = d.error;
let errCode = err ? err.code : "unknown";
let errMessage = err ? err.message : "No additional info";
​let reason = "မသိရသေးသော အမှား";
if (errCode === 1) reason = "ဖိုင်တင်ခြင်းကို အသုံးပြုသူက ဖျက်လိုက်သည် (MEDIA_ERR_ABORTED)";
else if (errCode === 2) reason = "ကွန်ရက် သို့မဟုတ် ဒေတာ ပို့လွှတ်မှု အမှားအယွင်းရှိသည် (MEDIA_ERR_NETWORK)";
else if (errCode === 3) reason = "ဗီဒီယိုဖိုင် ပျက်စီးနေသည် သို့မဟုတ် ဖုန်းဘရောက်ဇာက မထောက်ပံ့သော ဖော်မတ်ဖြစ်နေသည် (MEDIA_ERR_DECODE)";
else if (errCode === 4) reason = "ဖုန်းဘရောက်ဇာက ဤဗီဒီယိုဖိုင်အမျိုးအစားကို လုံးဝ လက်မခံပါ (MEDIA_ERR_SRC_NOT_SUPPORTED)";
​alert("ဗီဒီယိုဖွင့်၍မရပါ!\nအကြောင်းရင်း: " + reason + "\n(Error Code: " + errCode + ")");
};
​function m() {
d.muted = !d.muted;
}
​let au = document.getElementById('a');
let ap = document.getElementById('ap');
​au.onchange = function(e) {
let file = e.target.files[0];
if (file) {
ap.src = URL.createObjectURL(file);
ap.style.display = 'block';
ap.load();
}
}
​ap.onerror = function() {
alert("အသံဖိုင်ဖွင့်၍မရပါ။ အသံဖိုင်အမျိုးအစားကို စစ်ဆေးပါ။");
};
</script>
</body>
</html>

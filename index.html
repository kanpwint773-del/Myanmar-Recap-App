​<!DOCTYPE html>
<html>
<head>
<title>Movie Recap</title>
</head>
<body>
<h2>ဗီဒီယို တင်ရန်</h2>
<input type="file" id="v">



<video id="p" controls style="width:100%; display:none;"></video>


<button onclick="m()" style="padding:10px; margin-top:10px;">အသံပိတ်ရန် (Mute)</button>
<script>
let u = document.getElementById('v');
let d = document.getElementById('p');
u.onchange = function(e) {
d.src = URL.createObjectURL(e.target.files[0]);
d.style.display = 'block';
}
function m() {
d.muted = !d.muted;
}
</script>
</body>
</html>
